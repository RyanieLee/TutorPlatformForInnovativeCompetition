name: Frontend Build
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:workflows
      - run: npm run typecheck:workflows
      - run: npm run build:h5
      - uses: actions/upload-artifact@v4
        with:
          name: mock-h5-dist
          path: dist/build/h5
      - run: npm run build:mp-weixin
      - run: npm run build:h5
        env:
          VITE_DATA_MODE: api
          VITE_API_BASE_URL: http://127.0.0.1:3001
      - run: npm run build:mp-weixin
        env:
          VITE_DATA_MODE: api
          VITE_API_BASE_URL: http://127.0.0.1:3001

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
        env:
          DATABASE_URL: file:./dev.db
      - run: npm run build
      - run: npm test
      - run: npm run test:demo
      - run: npm run test:teaching-demo

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: |
            playwright-report/
            test-results/
            docs/screenshots/d-*.png
            docs/screenshots/teaching-*.png
